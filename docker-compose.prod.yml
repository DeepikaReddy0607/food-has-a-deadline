services:
  db:
    image: postgres:16-alpine
    container_name: fhd-prod-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-food_has_a_deadline}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fhd_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-food_has_a_deadline}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fhd-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fhd-prod-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-food_has_a_deadline}
      SECRET_KEY: ${SECRET_KEY:-fhd-dev-insecure-secret-key-change-in-production}
      JWT_SECRET: ${JWT_SECRET:-fhd-dev-insecure-secret-key-change-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-http://router.project-osrm.org}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      PROJECT_NAME: "Food Has a Deadline"
      VERSION: "1.0.0"
    ports:
      - "8000:8000"
    networks:
      - fhd-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: fhd-prod-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - fhd-network

volumes:
  fhd_prod_postgres_data:
    driver: local

networks:
  fhd-network:
    driver: bridge
